name: Render video
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Which video"
        type: choice
        default: main
        options:
          - main
          - pilot3d
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - name: Render main
        if: ${{ inputs.video == 'main' }}
        run: npx remotion render src/index.tsx Prices99 out/video.mp4
      - name: Render 3D pilot
        if: ${{ inputs.video == 'pilot3d' }}
        run: npx remotion render src/index3d.tsx Pilot3D out/video.mp4 --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
