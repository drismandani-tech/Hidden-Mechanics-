name: Render video
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Which video"
        type: choice
        default: preview3d
        options:
          - preview3d
          - full3d
          - main
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - name: Render 2D video
        if: ${{ inputs.video == 'main' }}
        run: npx remotion render src/index.tsx Prices99 out/video.mp4
      - name: Render 3D preview stills
        if: ${{ inputs.video == 'preview3d' }}
        run: |
          for f in 60 220 540 765 910 1020; do
            npx remotion still src/index3d.tsx Prices3D out/still-$f.png --frame=$f --gl=swangle
          done
      - name: Render 3D full video
        if: ${{ inputs.video == 'full3d' }}
        run: npx remotion render src/index3d.tsx Prices3D out/video.mp4 --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: out/*
